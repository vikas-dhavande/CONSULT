<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FD366E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5FFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF6D1B" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)" />
  <rect width="800" height="900" fill="url(#grid)" />
  <circle cx="250" cy="300" r="220" fill="url(#orbGrad1)" filter="blur(60px)" />
  <circle cx="550" cy="600" r="260" fill="url(#orbGrad2)" filter="blur(70px)" />
  <g transform="translate(400, 450)">
    <circle cx="0" cy="0" r="90" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
    <circle cx="0" cy="0" r="60" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <path d="M-25 -25 L25 25 M-25 25 L25 -25" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <text x="0" y="140" font-family="sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">VIKAS CONSULTING</text>
    <text x="0" y="170" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Secure Cloud Architecture</text>
  </g>
</svg>
