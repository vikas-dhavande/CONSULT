<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6D1B" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#6B5FFF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5FFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#E11D48" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF6D1B" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Elements -->
  <rect x="150" y="80" width="500" height="400" rx="40" fill="url(#glowGrad)" filter="url(#blurGlow)" />

  <!-- Base App Window Mockup -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="50" width="660" height="500" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="70" y="50" width="660" height="44" rx="20" fill="#0b0f19" />
    <path d="M70 74 h660 v20 h-660 z" fill="#0b0f19" />
    <line x1="70" y1="94" x2="730" y2="94" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Dots -->
    <circle cx="98" cy="72" r="5.5" fill="#ef4444" />
    <circle cx="116" cy="72" r="5.5" fill="#f59e0b" />
    <circle cx="134" cy="72" r="5.5" fill="#10b981" />

    <!-- Window Title / Tab -->
    <rect x="220" y="62" width="280" height="22" rx="6" fill="#1e293b" />
    <text x="360" y="77" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">vikas-consult.cloud/architecture</text>
  </g>

  <!-- Left Sidebar / Navigation Mock -->
  <g>
    <rect x="90" y="114" width="130" height="416" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    
    <!-- Nav Items -->
    <rect x="104" y="134" width="102" height="26" rx="6" fill="#6B5FFF" fill-opacity="0.25" stroke="#6B5FFF" stroke-width="1" />
    <circle cx="118" cy="147" r="4" fill="#818cf8" />
    <rect x="130" y="144" width="62" height="6" rx="3" fill="#e2e8f0" />

    <rect x="104" y="172" width="102" height="26" rx="6" fill="transparent" />
    <circle cx="118" cy="185" r="4" fill="#64748b" />
    <rect x="130" y="182" width="50" height="6" rx="3" fill="#64748b" />

    <rect x="104" y="210" width="102" height="26" rx="6" fill="transparent" />
    <circle cx="118" cy="223" r="4" fill="#64748b" />
    <rect x="130" y="220" width="56" height="6" rx="3" fill="#64748b" />

    <rect x="104" y="248" width="102" height="26" rx="6" fill="transparent" />
    <circle cx="118" cy="261" r="4" fill="#64748b" />
    <rect x="130" y="258" width="44" height="6" rx="3" fill="#64748b" />

    <!-- Storage Gauge -->
    <rect x="104" y="440" width="102" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="114" y="460" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600">APPWRITE DB</text>
    <rect x="114" y="472" width="82" height="6" rx="3" fill="#1e293b" />
    <rect x="114" y="472" width="62" height="6" rx="3" fill="url(#accentGrad)" />
    <text x="114" y="496" fill="#38bdf8" font-family="system-ui" font-size="10">84% Synced</text>
  </g>

  <!-- Main Dashboard Canvas -->
  <g>
    <!-- Top Stats Row -->
    <!-- Card 1: Requests -->
    <g filter="url(#cardShadow)">
      <rect x="236" y="114" width="150" height="88" rx="12" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="252" y="138" fill="#9ca3af" font-family="system-ui" font-size="11" font-weight="500">Cloud Traffic</text>
      <text x="252" y="166" fill="#f9fafb" font-family="system-ui" font-size="20" font-weight="700">1.4M /s</text>
      <path d="M330 156 Q 345 140, 360 160 T 376 134" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Card 2: Latency -->
    <g filter="url(#cardShadow)">
      <rect x="398" y="114" width="150" height="88" rx="12" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="414" y="138" fill="#9ca3af" font-family="system-ui" font-size="11" font-weight="500">API Latency</text>
      <text x="414" y="166" fill="#38bdf8" font-family="system-ui" font-size="20" font-weight="700">14 ms</text>
      <circle cx="524" cy="150" r="10" fill="#0284c7" fill-opacity="0.2" />
      <circle cx="524" cy="150" r="4" fill="#38bdf8" />
    </g>

    <!-- Card 3: Cloud Uptime -->
    <g filter="url(#cardShadow)">
      <rect x="560" y="114" width="150" height="88" rx="12" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="576" y="138" fill="#9ca3af" font-family="system-ui" font-size="11" font-weight="500">Uptime SLA</text>
      <text x="576" y="166" fill="#a855f7" font-family="system-ui" font-size="20" font-weight="700">99.99%</text>
      <rect x="656" y="146" width="36" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
      <text x="674" y="159" fill="#10b981" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">LIVE</text>
    </g>

    <!-- Center Chart / Infrastructure View -->
    <g filter="url(#cardShadow)">
      <rect x="236" y="218" width="474" height="200" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- Chart Grid Lines -->
      <line x1="260" y1="260" x2="686" y2="260" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="260" y1="310" x2="686" y2="310" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="260" y1="360" x2="686" y2="360" stroke="#1e293b" stroke-dasharray="4 4" />

      <!-- Area Gradient Fill -->
      <path d="M260 380 Q 320 290, 380 320 T 500 270 T 610 240 T 686 280 L 686 390 L 260 390 Z" fill="url(#glowGrad)" opacity="0.6" />
      
      <!-- Chart Smooth Line -->
      <path d="M260 380 Q 320 290, 380 320 T 500 270 T 610 240 T 686 280" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" />

      <!-- Chart Data Points -->
      <circle cx="380" cy="320" r="5" fill="#6B5FFF" stroke="#ffffff" stroke-width="2" />
      <circle cx="500" cy="270" r="5" fill="#E11D48" stroke="#ffffff" stroke-width="2" />
      <circle cx="610" cy="240" r="6" fill="#FF6D1B" stroke="#ffffff" stroke-width="2.5" />

      <!-- Node Tag -->
      <rect x="580" y="200" width="80" height="26" rx="6" fill="#030712" stroke="#FF6D1B" stroke-width="1" />
      <text x="620" y="217" fill="#fb923c" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Peak 48 Gbps</text>
    </g>

    <!-- Bottom Architecture Flow -->
    <g>
      <rect x="236" y="432" width="230" height="98" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="252" y="456" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Edge CDN Routing</text>
      <text x="252" y="474" fill="#94a3b8" font-family="system-ui" font-size="10">Cloudflare &amp; Global DNS</text>
      <rect x="252" y="490" width="80" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
      <text x="292" y="505" fill="#34d399" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">Operational</text>

      <rect x="480" y="432" width="230" height="98" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="496" y="456" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Appwrite OAuth &amp; Auth</text>
      <text x="496" y="474" fill="#94a3b8" font-family="system-ui" font-size="10">Google, GitHub, LinkedIn</text>
      <rect x="496" y="490" width="80" height="22" rx="11" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="0.8" />
      <text x="536" y="505" fill="#818cf8" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">Verified</text>
    </g>
  </g>
</svg>
